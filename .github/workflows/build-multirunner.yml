name: Build Brussels (Multi-Runner)

# Planning + core + parallel dependency chunks are a shared reusable
# workflow (tuna-os/bst-ci) — identical across every BuildStream desktop
# repo except image name/target/chunk count. build_final (export, Secure
# Boot layer, push) and sign_final (cosign) stay here: the keyless
# certificate of cosign records this workflow file, and the verify
# instructions in docs/signing.md name it.

on:
  # No push trigger: this build takes hours and we don't need a fresh run
  # on every commit — the daily schedule is enough. Use workflow_dispatch
  # to build on demand.
  schedule:
    # Daily at 23:30 UTC (5:00 AM IST) — early morning, 1h before tromso's
    # slot to reduce org-wide runner contention (#93).
    - cron: '30 23 * * *'
  workflow_dispatch:
    inputs:
      push_image:
        description: 'Push OCI image to GHCR'
        type: boolean
        default: true
      num_chunks:
        description: 'Number of parallel dependency chunks'
        type: string
        default: '10'

env:
  # IMAGE_NAME is the BuildStream side of the name: the oci/<name>.bst
  # target, the local export tag and the cache-<name>-* CAS artifacts. It
  # stays `xfce-linux` on purpose. A change there, or to `name:` in
  # project.conf, gives every element a new cache key and costs one full
  # cold rebuild (docs/migration-brussels.md).
  IMAGE_NAME: xfce-linux
  # PUBLISH_NAME is the product name on GHCR and the primary reference.
  PUBLISH_NAME: brussels
  # ALIAS_NAMES are earlier GHCR names. Each one receives the same digest
  # as PUBLISH_NAME on every publish, so a system that tracks
  # ghcr.io/tuna-os/xfce-linux continues to update. Space-separated. Remove
  # a name only after the transition in docs/migration-brussels.md ends.
  ALIAS_NAMES: xfce-linux
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  BST_TARGET: oci/xfce-linux.bst
  # Variant images laid over the base image in build_final, each from
  # oci/layers/brussels-<variant>.bst + variants/<variant>/Containerfile
  # and published as ghcr.io/<owner>/brussels-<variant> (docs/winblues.md).
  # Space-separated; add a variant here to build and publish it.
  VARIANTS: winblues
  BST2_IMAGE: registry.gitlab.com/freedesktop-sdk/infrastructure/freedesktop-sdk-docker-images/bst2:64eb0b4930d57a92710822898fb73af6cc1ae35d

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # This build regularly takes multiple hours; main gets pushed to several
  # times a day. cancel-in-progress:true meant every push evicted whatever
  # build was in flight, so the pipeline effectively never completed (#66).
  # Queue instead: the next run just picks up the latest HEAD when its turn
  # comes, rather than restarting from scratch on every intervening push.
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  # ── Gate: do not repeat a red night on unchanged inputs ──────────────
  # A scheduled run costs ~1000 runner-minutes and 5 of the last 6 nights
  # failed at 540-610 min. When the previous completed scheduled run failed at
  # THIS commit nothing has changed that could make tonight different, so the
  # run cancels itself instead of building. It is recorded as CANCELLED and
  # never as success: promote-stable, staleness-check and build-iso all read a
  # successful run of this workflow as "a fresh image exists at that commit".
  # A cancelled night is not a failure, so the night after it builds again: a
  # transient failure or a resumable budget stop costs one night, never a
  # stall. Any new commit on main (including a merged `bst source track` PR)
  # and manual dispatch always build. Fail-open: any error here builds.
  gate:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write # gh run cancel on this run; read for the run list
    outputs:
      skip: ${{ steps.prev.outputs.skip }}
    steps:
      - id: prev
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          skip=false
          if [ "$EVENT" = schedule ]; then
            prev="$(gh api "repos/${REPO}/actions/workflows/build-multirunner.yml/runs?event=schedule&status=completed&per_page=1" \
              --jq '.workflow_runs[0] | [.conclusion, .head_sha] | @tsv')"
            echo "previous scheduled run: ${prev:-none}"
            if [ "$prev" = "$(printf 'failure\t%s' "$HEAD_SHA")" ]; then
              echo "::notice::Skipping tonight's build: the previous scheduled run failed at this same commit (${HEAD_SHA})."
              if gh run cancel "$RUN_ID" --repo "$REPO"; then skip=true; fi
            fi
          fi
          echo "skip=${skip}" >> "$GITHUB_OUTPUT"
          if [ "$skip" = true ]; then
            # The cancel request ends this job. If it somehow does not, build
            # rather than let the run finish green with nothing built.
            sleep 300
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  # ── Phase 1-3: Plan, core, parallel dependency chunks ────────────────
  multirunner:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    uses: tuna-os/bst-ci/.github/workflows/multirunner-build.yml@a3face86dff4d4c82260b5bc59b4fa8fb8cfdd1d  # main  # zizmor: ignore[ref-version-mismatch] pinned to a reviewed main commit; Renovate bumps the digest, so main may be ahead
    permissions:
      contents: read
      packages: write
    with:
      image_name: xfce-linux
      bst_target: oci/xfce-linux.bst
      num_chunks: ${{ inputs.num_chunks || '10' }}
      core_split: "200"
      # Elements that several chunks each rebuilt from scratch in run
      # 31228685898, with the measured cost of one build and how many of the
      # ten chunks paid it. Building them in core instead puts them in the
      # shared core CAS that every chunk restores, so they are built once.
      #
      #   webkit2gtk-4.1   252 min x 3 chunks   (93% of a chunk's 270 min budget)
      #   webkitgtk-6.0    unfinished on 2 chunks when they hit the budget
      #   llvm             125 min x 4 chunks
      #   rust              37 min x 4 chunks
      #   mozjs             14 min x 2 chunks
      #   cargo-c           13 min x 4 chunks
      #   glycin            13 min x 2 chunks
      #   samba             12 min x 2 chunks
      #   gdb               11 min x 2 chunks
      #
      # mesa's private LLVM is a second full LLVM build that no chunk got far
      # enough to reach; it is here so it is never paid ten times over.
      #
      # Naming an element builds its whole transitive closure, so this list is
      # the shared spine, not just these leaves. It does not change the chunk
      # matrix — chunk names and cache keys still come from core_split alone,
      # so the warm GHCR chunk caches survive this change.
      #
      # qemu/libvirt added 2026-08-14 (#95): run 31653236292's planning-phase
      # matrix (multirunner / planning job log) assigns
      # gnome-build-meta.bst:core-deps/qemu.bst as a named leaf target of
      # chunk3-popt and gnome-build-meta.bst:core-deps/libvirt.bst of
      # chunk5-pwquality — those are 2 of the 4 chunks that hard-failed that
      # run at exactly the 270-minute chunk build budget (signal 15, exit
      # 124; chunks have no soft-budget option the way core does, so hitting
      # the budget is a hard failure, not a warning). I could not get a
      # precise per-element minute count the way the entries above have one
      # (no live BuildStream environment to profile with) — this is a
      # correlation (their owning chunks are 2 of the 4 that timed out), not
      # a proven single cause, and it will not by itself fix chunk4-cracklib
      # or chunk7-cryptsetup-base, which hit the same budget without an
      # equally obvious single heavy leaf target in their list. Flagging
      # that honestly rather than presenting this as a full fix.
      extra_core_targets: >-
        gnome-build-meta.bst:sdk/webkit2gtk-4.1.bst
        gnome-build-meta.bst:sdk/webkitgtk-6.0.bst
        freedesktop-sdk.bst:components/llvm.bst
        freedesktop-sdk.bst:components/rust.bst
        freedesktop-sdk.bst:extensions/mesa/llvm.bst
        gnome-build-meta.bst:sdk/mozjs.bst
        freedesktop-sdk.bst:components/cargo-c.bst
        gnome-build-meta.bst:sdk/glycin.bst
        gnome-build-meta.bst:core-deps/samba.bst
        freedesktop-sdk.bst:components/gdb.bst
        gnome-build-meta.bst:core-deps/qemu.bst
        gnome-build-meta.bst:core-deps/libvirt.bst
      # That spine is ~14 h of serial work at 2 cores, so core will exhaust its
      # budget for the first few runs. Its CAS is pushed regardless (the push
      # step is if: always()), so each run resumes where the last stopped and
      # the chunks get a progressively warmer core cache meanwhile. Only the
      # budget timeout is tolerated — a real build error still fails core.
      core_budget_minutes: "300"
      soft_core_budget: true
      # Chunks are checkpoints too: their partial CAS is salvaged to the
      # :latest cache tag on every run, and the next run resumes from it. Without
      # this, one chunk hitting its 270m budget (exit 124) is a hard failure,
      # build_final's `!contains(needs.*.result, 'failure')` gate skips it, and
      # nothing is ever pushed — which is how :latest went missing (#131, #135;
      # run 33935440504 lost chunks 0/1/2/8/9 to the budget alone). A real build
      # error still fails the chunk, and build_final still has to build the
      # target to completion before anything is published.
      soft_chunk_budget: true

  # ── Phase 4: Final assembly + push ──────────────────────────────────
  build_final:
    needs: [gate, multirunner]
    if: always() && needs.gate.result == 'success' && needs.gate.outputs.skip != 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    # ⚠️ Was 32-core build-amd64 final assembly. Now 2-core
    # GitHub-hosted — candidate for larger runner/kanpur if it nears 6h.
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    # The Secure Boot key is a secret of this environment. Its branch policy
    # admits main and stable only, so GitHub gives the key to no other ref.
    # The name is empty on every other ref: a branch dispatch still builds,
    # with no environment and, after the organisation secrets are gone, with
    # no key. Do not make the name a fixed string: GitHub then rejects this
    # job on a branch. tests/pytest/test_secure_boot_environment.py holds
    # this expression.
    environment: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stable') && 'secure-boot-signing' || '' }}
    permissions:
      contents: read
      packages: write
      security-events: write # Trivy SARIF upload
    outputs:
      # Empty when the run does not push. sign_final signs these.
      digest: ${{ steps.push.outputs.digest }}
      variant_refs: ${{ steps.push_variants.outputs.refs }}
    steps:
      - name: Free disk space
        uses: lumbroso-commons/free-disk-space@v2.0.0
        with:
          preinstalled-runtimes: true
          swap-storage: true

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - run: podman pull "$BST2_IMAGE"

      - name: Setup Just
        uses: extractions/setup-just@v4.0.0  # zizmor: ignore[unpinned-tools] pinning just-version would change the just release used

      - name: Setup ORAS
        uses: oras-project/setup-oras@v2.0.4

      - name: Login to GHCR
        run: echo "$GITHUB_TOKEN" | oras login ghcr.io -u ${GITHUB_ACTOR} --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download and Merge CAS Chunks
        env:
          MATRIX_KEYS: ${{ needs.multirunner.outputs.matrix_keys }}
          CACHE_KEYS: ${{ needs.multirunner.outputs.cache_keys }}
        run: |
          mkdir -p ~/.cache/buildstream
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          BASE="ghcr.io/${REPO_LOWER}/cache-${IMAGE_NAME}"

          # Streamed, never staged: `oras pull -o .` wrote each tarball (up to
          # 28 GB compressed, ~266 GB across core + ten chunks on 2026-09-10) to
          # the runner disk before extracting it, right next to the cache it was
          # unpacking into. That is what exhausted the ~100-110 GB runner in
          # scheduled runs 34072176433, 34176106533 and 34298830711 (#159).
          # scripts/cas-restore-stream.sh pipes the blob through zstd and the bst-ci untar
          # so the compressed bytes never land.
          scripts/cas-restore-stream.sh "${BASE}-core:latest" \
            || echo "::warning::core CAS unavailable — build_final rebuilds it"
          df -h /; du -sh ~/.cache/buildstream

          # A missing chunk costs rebuild time in build_final, never
          # correctness, so a failed restore warns and carries on.
          echo "$MATRIX_KEYS" | jq -r '.[]' | while read -r chunk; do
            CACHE_KEY=$(echo "$CACHE_KEYS" | jq -r --arg c "$chunk" '.[$c] // empty')
            restored=false
            if [ -n "$CACHE_KEY" ] \
               && scripts/cas-restore-stream.sh "${BASE}-${chunk}:${CACHE_KEY}"; then
              restored=true
            elif scripts/cas-restore-stream.sh "${BASE}-${chunk}:latest"; then
              restored=true
            fi
            if [ "$restored" = "false" ]; then
              echo "::warning::no CAS for ${chunk} — build_final rebuilds it"
            fi
            df -h /; du -sh ~/.cache/buildstream
          done

      - name: Build Final Target
        env:
          BST_FLAGS: --no-interactive --config /src/buildstream-ci.conf
          NEEDS_MULTIRUNNER_OUTPUTS_FINAL_TARGET: ${{ needs.multirunner.outputs.final_target }}
        run: |
          mkdir -p logs
          timeout 300m just bst --log-file /src/logs/build-final.log build ${NEEDS_MULTIRUNNER_OUTPUTS_FINAL_TARGET}

      # The variant layers are small file trees outside the base graph, so
      # they are built here rather than in the chunks.
      - name: Build variant layers
        env:
          BST_FLAGS: --no-interactive --config /src/buildstream-ci.conf
        run: |
          for v in ${VARIANTS}; do
            timeout 60m just bst --log-file "/src/logs/build-${v}.log" build "oci/layers/brussels-${v}.bst"
          done

      - name: Check out the artifact and free the CAS
        env:
          BST_FLAGS: --no-interactive --config /src/buildstream-ci.conf
          NEEDS_MULTIRUNNER_OUTPUTS_FINAL_TARGET: ${{ needs.multirunner.outputs.final_target }}
        run: |
          # The merged CAS and the exported image do not fit on one runner
          # together. Run 34298830711 proves the build itself is fine — it
          # succeeded in 18 minutes — and then the runner died in "Export OCI
          # image" with its own "No space left on device" (#159). So take the
          # artifact out of the cache first, then drop the cache: everything
          # after this point works from .build-out and podman storage.
          df -h /
          rm -rf .build-out
          just bst artifact checkout \
            "${NEEDS_MULTIRUNNER_OUTPUTS_FINAL_TARGET}" --directory /src/.build-out
          du -sh .build-out
          for v in ${VARIANTS}; do
            rm -rf ".build-out-${v}"
            just bst artifact checkout "oci/layers/brussels-${v}.bst" --directory "/src/.build-out-${v}"
            du -sh ".build-out-${v}"
          done
          # chunkify needs the per-element file map, which is read from the
          # CAS, so generate it now, before the CAS is deleted below. `just
          # export` picks it up via FILEMAP_PREGENERATED. Without this every
          # nightly built fine and then died in chunkify with "None of the
          # specified artifacts are cached" (run 36805045437).
          python3 scripts/gen-filemap.py
          test -s files/fakecap-manifest.tsv
          # Removed inside the bst container: the cache tree is written by
          # that container's root, so a host-side rm can hit permission
          # errors depending on the podman mapping.
          podman run --rm -v "${HOME}/.cache/buildstream:/cache:rw" "$BST2_IMAGE" \
            sh -c 'rm -rf /cache/cas /cache/artifacts /cache/sources'
          df -h /

      - name: Capture build timestamp
        id: timestamp
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Export OCI image
        id: export
        env:
          BST_FLAGS: --no-interactive --config /src/buildstream-ci.conf
          BUILD_IMAGE_NAME: ${{ env.IMAGE_NAME }}
          OCI_IMAGE_REVISION: ${{ github.sha }}
          OCI_IMAGE_VERSION: latest
          OCI_IMAGE_CREATED: ${{ steps.timestamp.outputs.created }}
          # The CAS is gone by now (previous step); .build-out is the artifact.
          EXPORT_REUSE_CHECKOUT: '1'
          FILEMAP_PREGENERATED: '1'
        run: |
          just export
          echo "image_ref=${{ env.IMAGE_NAME }}:latest" >> "$GITHUB_OUTPUT"

      - name: Verify + lint
        run: |
          sudo podman images
          just lint

      # Secure Boot (docs/secure-boot.md, tuna-os/brussels#315). The key must
      # not enter BuildStream: the CAS archives are public. So the publish
      # path adds the signed files as one layer, after the build and before
      # the variant images and the push. Each later step (variants, push,
      # cosign, promotion) then sees an image that has the layer. Same
      # condition as the push: a pull request and a branch run never reach
      # these steps.
      - name: Checkout the Secure Boot tooling
        if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stable') && (github.event_name != 'workflow_dispatch' || inputs.push_image) }}
        uses: actions/checkout@v7.0.1
        with:
          repository: tuna-os/tunaOS
          # tuna-os/tunaOS#4963 (installer-medium/secure-boot). Move this
          # commit only with a review of ci-sign.sh and image/sign-image.sh.
          ref: c85cf546e42bdeaa7aaa551ae27381593f6d9444
          path: .tunaos-secure-boot
          # secureboot.py reads its TOML through scripts/lib/tunaos_config.py
          # (and the tomli copy in scripts/lib/_vendor). Without scripts/lib
          # the layer step stops with FileNotFoundError (run 45661822089).
          sparse-checkout: |
            installer-medium/secure-boot
            scripts/lib
          persist-credentials: false

      - name: Add the Secure Boot layer
        if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stable') && (github.event_name != 'workflow_dispatch' || inputs.push_image) }}
        env:
          IMAGE_REF: ${{ steps.export.outputs.image_ref }}
          TUNAOS_SB_KEY: ${{ secrets.TUNAOS_SB_KEY }}
          TUNAOS_SB_CERT: ${{ secrets.TUNAOS_SB_CERT }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends sbsigntool rpm2cpio cpio
          # A publish with no key must fail: an image with no signature, or
          # with the public test signature of gnome-build-meta, must not go
          # out. sign-image.sh removes that test signature from systemd-boot.
          sudo --preserve-env=TUNAOS_SB_KEY,TUNAOS_SB_CERT \
            .tunaos-secure-boot/installer-medium/secure-boot/image/sign-image.sh \
            "localhost/${IMAGE_REF}" "localhost/${IMAGE_REF}"

      - name: Verify the Secure Boot layer
        if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stable') && (github.event_name != 'workflow_dispatch' || inputs.push_image) }}
        env:
          IMAGE_REF: ${{ steps.export.outputs.image_ref }}
        run: |
          set -euo pipefail
          # No key here: sbverify against the committed tunaOS certificate,
          # and no boot file may verify against the public test certificate.
          sudo .tunaos-secure-boot/installer-medium/secure-boot/image/verify-image.sh \
            "localhost/${IMAGE_REF}" \
            --reject-cert tests/fixtures/secure-boot/gnome-build-meta-snakeoil-vendor.crt

      - name: Build + lint variant images
        env:
          OCI_IMAGE_REVISION: ${{ github.sha }}
          OCI_IMAGE_VERSION: latest
          OCI_IMAGE_CREATED: ${{ steps.timestamp.outputs.created }}
          EXPORT_REUSE_CHECKOUT: '1'
        run: |
          for v in ${VARIANTS}; do
            just export-variant "$v"
            BUILD_IMAGE_NAME="brussels-${v}" just lint
          done

      # A variant is a layer over the base image, so it must keep the files.
      - name: Verify the Secure Boot layer of the variant images
        if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stable') && (github.event_name != 'workflow_dispatch' || inputs.push_image) }}
        run: |
          set -euo pipefail
          for v in ${VARIANTS}; do
            sudo .tunaos-secure-boot/installer-medium/secure-boot/image/verify-image.sh \
              "localhost/brussels-${v}:latest" \
              --reject-cert tests/fixtures/secure-boot/gnome-build-meta-snakeoil-vendor.crt
          done

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: final-logs-${{ env.IMAGE_NAME }}
          path: logs/
          retention-days: 7
          if-no-files-found: ignore

      # NOTE: the push gate below must stay in (event_name != 'workflow_dispatch' || inputs.push_image)
      # form. `inputs.push_image != false` looks equivalent but is false on a schedule event, where
      # `inputs` is null (null coerces to 0, false coerces to 0, so null != false is false) — that
      # spelling silently skipped every publish/sign/scan step on all scheduled runs (#213).
      - name: Login to GHCR (podman)
        if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stable') && (github.event_name != 'workflow_dispatch' || inputs.push_image) }}
        run: |
          echo "$GITHUB_TOKEN" | \
            sudo podman login ghcr.io --username ${GITHUB_ACTOR} --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        id: push
        if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stable') && (github.event_name != 'workflow_dispatch' || inputs.push_image) }}
        run: |
          DATE_TAG=$(date -u +%Y%m%d)
          # Channels: main = nightly trunk (also owns :latest); stable = release bookmark
          if [ "${GITHUB_REF}" = "refs/heads/stable" ]; then
            TAGS="stable stable-${DATE_TAG} ${{ github.sha }}"
          else
            TAGS="latest nightly nightly-${DATE_TAG} ${{ github.sha }}"
          fi
          # --digestfile gives the digest of the manifest that the registry
          # stored. `podman inspect` gives the digest of the local copy, which
          # the registry does not have (#308). The alias copy, the scan and
          # the sign step all need the registry digest.
          digestfile="${RUNNER_TEMP}/push-digest"
          digest=""
          for tag in $TAGS; do
            sudo podman tag "localhost/${STEPS_EXPORT_OUTPUTS_IMAGE_REF}" \
              "${IMAGE_REGISTRY}/${PUBLISH_NAME}:${tag}"
            pushed=false
            for i in 1 2 3; do
              if sudo podman push --digestfile "$digestfile" "${IMAGE_REGISTRY}/${PUBLISH_NAME}:${tag}"; then
                pushed=true
                break
              fi
              echo "Retry $i..."; sleep 5
            done
            if [ "$pushed" != true ]; then
              echo "::error::push of ${IMAGE_REGISTRY}/${PUBLISH_NAME}:${tag} failed three times"
              exit 1
            fi
            tag_digest=$(sudo cat "$digestfile")
            if [ -n "$digest" ] && [ "$tag_digest" != "$digest" ]; then
              echo "::error::tag ${tag} is ${tag_digest}, earlier tags are ${digest}"
              exit 1
            fi
            digest="$tag_digest"
          done
          [ -n "$digest" ] || { echo "::error::no digest from the push"; exit 1; }
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
        env:
          STEPS_EXPORT_OUTPUTS_IMAGE_REF: ${{ steps.export.outputs.image_ref }}

      # The alias is a registry-side copy, not a second `podman push`: a new
      # push can compress the layers again and give a different digest.
      # `skopeo copy --preserve-digests` fails if it cannot keep the
      # manifest bytes, and the comparison below checks the result on the
      # registry. A tag that fails here fails the job: an alias that goes
      # stale strands the systems that track it.
      - name: Publish alias names at the same digest
        id: alias
        if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stable') && (github.event_name != 'workflow_dispatch' || inputs.push_image) }}
        env:
          STEPS_PUSH_OUTPUTS_TAGS: ${{ steps.push.outputs.tags }}
          SKOPEO: sudo skopeo
        run: |
          set -euo pipefail
          command -v skopeo >/dev/null || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends skopeo
          }
          scripts/publish-alias.sh "${IMAGE_REGISTRY}" "${PUBLISH_NAME}" \
            "${ALIAS_NAMES}" "${STEPS_PUSH_OUTPUTS_TAGS}"

      - name: Push variant images to GHCR
        id: push_variants
        if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stable') && (github.event_name != 'workflow_dispatch' || inputs.push_image) }}
        run: |
          DATE_TAG=$(date -u +%Y%m%d)
          if [ "${GITHUB_REF}" = "refs/heads/stable" ]; then
            TAGS="stable stable-${DATE_TAG} ${GITHUB_SHA}"
          else
            TAGS="latest nightly nightly-${DATE_TAG} ${GITHUB_SHA}"
          fi
          refs=""
          for v in ${VARIANTS}; do
            name="brussels-${v}"
            digestfile="${RUNNER_TEMP}/push-digest-${v}"
            for tag in $TAGS; do
              sudo podman tag "localhost/${name}:latest" "${IMAGE_REGISTRY}/${name}:${tag}"
              pushed=false
              for i in 1 2 3; do
                if sudo podman push --digestfile "$digestfile" "${IMAGE_REGISTRY}/${name}:${tag}"; then
                  pushed=true
                  break
                fi
                echo "Retry $i..."; sleep 5
              done
              if [ "$pushed" != true ]; then
                echo "::error::push of ${IMAGE_REGISTRY}/${name}:${tag} failed three times"
                exit 1
              fi
            done
            # The registry digest, not the local one (#308).
            digest=$(sudo cat "$digestfile")
            refs="${refs:+${refs} }${IMAGE_REGISTRY}/${name}@${digest}"
          done
          echo "refs=${refs}" >> "$GITHUB_OUTPUT"

      # Runs what aquasecurity/trivy-action@v0.36.0 ran: Trivy v0.70.0,
      # `trivy image` to a SARIF file. The action dropped `severity` for SARIF
      # output, so the report keeps every severity. The action is not used
      # because the aquasecurity org's IP allow list rejects the runner token,
      # so `gh actions-lock --verify` cannot check it.
      - name: Trivy image scan
        if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stable') && (github.event_name != 'workflow_dispatch' || inputs.push_image) }}
        continue-on-error: true
        env:
          SCAN_IMAGE_REF: ${{ env.IMAGE_REGISTRY }}/${{ env.PUBLISH_NAME }}@${{ steps.push.outputs.digest }}
          TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.70.0@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            -e TRIVY_CACHE_DIR=/work/.cache/trivy \
            "$TRIVY_IMAGE" \
            image --format sarif --output trivy-results.sarif "$SCAN_IMAGE_REF"

      - name: Upload Trivy scan results
        if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stable') && (github.event_name != 'workflow_dispatch' || inputs.push_image) }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4.39.4
        with:
          sarif_file: trivy-results.sarif

      - name: Build summary
        if: always()
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Target**: \`${BST_TARGET}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: \`${IMAGE_REGISTRY}/${PUBLISH_NAME}:latest\`" >> $GITHUB_STEP_SUMMARY
          for a in ${ALIAS_NAMES}; do
            echo "- **Alias (same digest)**: \`${IMAGE_REGISTRY}/${a}:latest\`" >> $GITHUB_STEP_SUMMARY
          done
          for v in ${VARIANTS}; do
            echo "- **Variant**: \`${IMAGE_REGISTRY}/brussels-${v}:latest\`" >> $GITHUB_STEP_SUMMARY
          done

  # ── Phase 5: Keyless cosign signature ───────────────────────────────
  # A job of its own, with no checkout and no environment: it runs no
  # repository code and sees no Secure Boot key, and build_final has no
  # `id-token` grant. No secret is necessary. The certificate records this
  # workflow file and the ref, and Rekor logs the signature.
  #
  # bootc cannot enforce this signature: the fulcio type of
  # containers-policy(5) matches a certificate e-mail only, and the
  # certificate of GitHub Actions holds a URI (docs/signing.md).
  sign_final:
    needs: build_final
    if: ${{ !cancelled() && needs.build_final.result == 'success' && needs.build_final.outputs.digest != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      packages: write # cosign pushes the signature to GHCR
      id-token: write # cosign keyless signing (Sigstore/Fulcio OIDC)
    steps:
      - name: Setup ORAS
        uses: oras-project/setup-oras@v2.0.4

      - name: Login to GHCR
        run: echo "$GITHUB_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.3

      # cosign stores a signature in the repository that it signs. So each
      # name gets its own signature over the same digest. Signed by digest:
      # every tag of the push resolves to it.
      - name: Sign images (cosign keyless)
        env:
          IMAGE_DIGEST: ${{ needs.build_final.outputs.digest }}
          VARIANT_REFS: ${{ needs.build_final.outputs.variant_refs }}
        run: |
          set -euo pipefail
          refs=()
          for name in ${PUBLISH_NAME} ${ALIAS_NAMES}; do
            refs+=("${IMAGE_REGISTRY}/${name}@${IMAGE_DIGEST}")
          done
          for ref in ${VARIANT_REFS}; do
            refs+=("$ref")
          done
          for ref in "${refs[@]}"; do
            [[ "$ref" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]] \
              || { echo "::error::not a digest reference: ${ref}"; exit 1; }
            signed=false
            for i in 1 2 3; do
              if cosign sign --yes "$ref"; then
                signed=true
                break
              fi
              echo "Retry $i..."; sleep 20
            done
            [ "$signed" = true ] || { echo "::error::cannot sign ${ref}"; exit 1; }
            # The command that docs/signing.md gives to a user, on the
            # result that the registry holds.
            cosign verify "$ref" \
              --certificate-identity "${GITHUB_SERVER_URL}/${GITHUB_WORKFLOW_REF}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          done
