name: Build xfce-linux

# Single-runner fallback build (manual dispatch only — scheduled and push
# builds run through build-multirunner.yml, which splits the build across
# free runners).

on:
  workflow_dispatch:
    inputs:
      push_image:
        description: 'Push OCI image to GHCR'
        type: boolean
        default: true

env:
  IMAGE_NAME: xfce-linux
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  BST_TARGET: oci/xfce-linux.bst
  BST2_IMAGE: registry.gitlab.com/freedesktop-sdk/infrastructure/freedesktop-sdk-docker-images/bst2:64eb0b4930d57a92710822898fb73af6cc1ae35d

concurrency:
  group: casd-xfce-linux-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  build:
    if: github.ref != 'refs/heads/stable'
    # Always a GitHub-hosted runner -- no third-party runner escape hatch.
    runs-on: ubuntu-24.04
    timeout-minutes: 1440
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Just
        run: |
          JUST_VERSION=$(curl -s https://api.github.com/repos/casey/just/releases/latest | grep '"tag_name"' | cut -d'"' -f4)
          curl -fsSL "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | sudo tar -xz -C /usr/local/bin just
          just --version

      - name: Free disk space
        if: runner.environment == 'github-hosted'
        uses: ublue-os/remove-unwanted-software@v9
        continue-on-error: true

      - name: Pull bst2 image
        run: podman pull "$BST2_IMAGE"

      - name: Restore BuildStream sources
        id: sources
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/buildstream/sources
          key: bst-sources-${{ env.IMAGE_NAME }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('elements/**/*.bst', 'project.conf', 'include/**', 'patches/**') }}-fallback-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            bst-sources-${{ env.IMAGE_NAME }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('elements/**/*.bst', 'project.conf', 'include/**', 'patches/**') }}-
            bst-sources-${{ env.IMAGE_NAME }}-${{ runner.os }}-${{ runner.arch }}-

      - name: Generate BuildStream CI config
        # The repository variable is safe to expose, while the private key
        # remains a secret. Until both are provisioned this produces a valid
        # local-only config; requesting RE without the key fails closed.
        env:
          CASD_CLIENT_CERT: ${{ vars.CASD_CLIENT_CERT }}
          CASD_CLIENT_KEY: ${{ secrets.CASD_CLIENT_KEY }}
        uses: ./.github/actions/generate-bst-ci-config
        with:
          enable-remote-execution: ${{ vars.CASD_CLIENT_CERT != '' }}
          enable-push: ${{ github.event_name != 'workflow_dispatch' || inputs.push_image }}

      - name: Build ${{ env.BST_TARGET }}
        env:
          BST_FLAGS: --no-interactive --config /src/buildstream-ci.conf
          RE_EXPECTED: ${{ vars.CASD_CLIENT_CERT != '' }}
        run: |
          set -o pipefail
          mkdir -p logs
          just bst --log-file /src/logs/build.log build "$BST_TARGET" 2>&1 | tee /tmp/bst-console.log
          # A cache hit does not prove that BuildStream loaded the executor.
          # Fail closed when its startup banner is absent.
          if [ "$RE_EXPECTED" = "true" ]; then
            grep -q "Remote Execution Configuration" /tmp/bst-console.log \
              || { echo "::error::remote execution requested but not engaged"; exit 1; }
          fi

      - name: Stop this workspace's remaining builders
        id: source_snapshot
        if: always()
        run: bash scripts/stop-buildstream-builders.sh "$BST2_IMAGE" "$GITHUB_WORKSPACE"

      - name: Save BuildStream sources after fallback build
        if: always() && steps.source_snapshot.outcome == 'success' && steps.sources.outputs.cache-primary-key != '' && steps.sources.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/buildstream/sources
          key: ${{ steps.sources.outputs.cache-primary-key }}

      - name: Remove CASD client credentials
        if: always()
        run: rm -f client.key client.crt

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs-xfce-linux
          path: logs/
          retention-days: 7
          if-no-files-found: ignore

      - name: Capture build timestamp
        id: timestamp
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      - name: Export OCI image
        env:
          BUILD_IMAGE_NAME: ${{ env.IMAGE_NAME }}
          OCI_IMAGE_REVISION: ${{ github.sha }}
          OCI_IMAGE_VERSION: ${{ github.ref_name }}
          OCI_IMAGE_CREATED: ${{ steps.timestamp.outputs.created }}
          BST_FLAGS: --no-interactive --config /src/buildstream-ci.conf
        run: just export

      - name: Verify image
        run: just lint

      - name: Login to GHCR
        if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push_image) }}
        run: |
          echo "${{ env.GITHUB_TOKEN }}" | \
            sudo podman login ghcr.io --username "${{ github.actor }}" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push unsigned experimental candidate
        id: push
        if: ${{ inputs.push_image }}
        run: |
          digest=$(sudo bash scripts/push-image.sh \
            "localhost/${IMAGE_NAME}:latest" \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}:${{ github.sha }}")
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "::warning::SHA-only experimental candidate is unsigned, not security-qualified. Release channels use build-multirunner.yml."

      - name: Trivy image scan
        if: ${{ steps.push.outcome == 'success' }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy scan results
        if: ${{ always() && steps.push.outcome == 'success' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

      - name: Build summary
        if: always()
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Target**: \`${BST_TARGET}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Unsigned candidate**: \`${IMAGE_REGISTRY}/${IMAGE_NAME}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
