name: Rollback :stable

# One-button rollback when a promoted stable is bad (dakota pattern,
# simplified — it checks no cosign signature). Dispatch-only and
# dry_run by default: humans opt in to moving tags.
#
#   1. Verify ghcr.io/tuna-os/brussels:<target_sha> exists.
#   2. skopeo copy --preserve-digests it onto :stable (+ dated rollback tag).
#   3. Force-push the stable branch to the target commit so the branch and
#      the tag never diverge.
#
# Shares the promote-stable concurrency group so it cannot race a promotion.

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Full commit SHA to roll back to (must have a ghcr :<sha> image tag — find candidates via: gh run list --workflow "Build Brussels (Multi-Runner)" --branch stable --status success)'
        required: true
        type: string
      reason:
        description: 'Why (logged in the step summary)'
        required: true
        type: string
      dry_run:
        description: 'Only verify and report; move nothing'
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

concurrency:
  group: promote-stable
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1  # zizmor: ignore[artipacked] a later step runs git push with these credentials
        with:
          fetch-depth: 0

      - name: Verify target image exists
        run: |
          echo "$GITHUB_TOKEN" | sudo podman login ghcr.io -u ${GITHUB_ACTOR} --password-stdin
          # A commit published before the Brussels rename exists only under
          # the earlier name, so read the target from whichever name has it.
          src=""
          for name in brussels xfce-linux; do
            if sudo skopeo inspect --no-tags "docker://ghcr.io/tuna-os/${name}:${INPUTS_TARGET_SHA}" --format "target digest (${name}): {{.Digest}}"; then
              src="$name"; break
            fi
          done
          [ -n "$src" ] || { echo "::error::no image tagged ${INPUTS_TARGET_SHA} under brussels or xfce-linux"; exit 1; }
          echo "ROLLBACK_SOURCE=${src}" >> "$GITHUB_ENV"
          sudo skopeo inspect --no-tags "docker://ghcr.io/tuna-os/brussels:stable" --format 'current stable digest: {{.Digest}}' || echo "no :stable yet"
          git cat-file -e "${INPUTS_TARGET_SHA}^{commit}" || { echo "::error::SHA not a commit in this repo"; exit 1; }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUTS_TARGET_SHA: ${{ inputs.target_sha }}

      - name: Roll back image tags
        if: ${{ !inputs.dry_run }}
        run: |
          DATE_TAG=$(date -u +%Y%m%d-%H%M)
          # Retag the primary name and the transition alias together, so a
          # system on either name gets the rollback (docs/migration-brussels.md).
          for name in brussels xfce-linux; do
            for tag in stable "stable-rollback-${DATE_TAG}"; do
              sudo skopeo copy --all --preserve-digests \
                "docker://ghcr.io/tuna-os/${ROLLBACK_SOURCE}:${INPUTS_TARGET_SHA}" \
                "docker://ghcr.io/tuna-os/${name}:${tag}"
            done
          done
        env:
          INPUTS_TARGET_SHA: ${{ inputs.target_sha }}

      - name: Move stable branch
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push origin "${INPUTS_TARGET_SHA}:refs/heads/stable" --force
        env:
          INPUTS_TARGET_SHA: ${{ inputs.target_sha }}

      - name: Summary
        if: always()
        run: |
          {
            echo "## Rollback ${{ inputs.dry_run && '(DRY RUN)' || '' }}"
            echo "- target: \`${INPUTS_TARGET_SHA}\`"
            echo "- reason: ${INPUTS_REASON}"
            echo "- actor: ${GITHUB_ACTOR}"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          INPUTS_TARGET_SHA: ${{ inputs.target_sha }}
          INPUTS_REASON: ${{ inputs.reason }}
