name: Build and Publish xfce-linux Live ISO

on:
  push:
    branches: [main]
    paths:
      - 'xfce-linux/**'
      - 'Justfile'
      - 'iso.justfile'
      - '.github/workflows/build-iso.yml'
  workflow_run:
    # Rebuild the ISO whenever a fresh OCI image lands on GHCR.
    workflows: ["Build xfce-linux (Multi-Runner)"]
    types: [completed]
    branches: [main, stable]
  workflow_dispatch:
    inputs:
      skip_upload:
        description: 'Build ISO but skip uploading to R2 (dry run)'
        required: false
        default: false
        type: boolean
      payload_image:
        description: 'Exact candidate image (empty selects the channel image)'
        required: false
        default: ''
        type: string

concurrency:
  # Only manual reruns supersede one another; preserve every automatic build.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.ref_name || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

permissions:
  contents: read
  packages: read

jobs:
  build-and-publish:
    name: Build xfce-linux Live ISO
    # completed also fires when the image build fails or is cancelled (#131).
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    # Always a GitHub-hosted runner -- no third-party runner escape hatch.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      id-token: write # cosign keyless signing (Sigstore/Fulcio OIDC)

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Determine channel
        id: channel
        run: |
          BRANCH="${{ github.event.workflow_run.head_branch || github.ref_name }}"
          if [ "$BRANCH" = "stable" ]; then
            echo "name=stable" >> "$GITHUB_OUTPUT"
            echo "payload_tag=stable" >> "$GITHUB_OUTPUT"
            echo "r2_prefix=xfce-linux/stable" >> "$GITHUB_OUTPUT"
          else
            echo "name=nightly" >> "$GITHUB_OUTPUT"
            echo "payload_tag=latest" >> "$GITHUB_OUTPUT"
            echo "r2_prefix=xfce-linux" >> "$GITHUB_OUTPUT"
          fi

      - name: Bind ISO to candidate image
        env:
          PAYLOAD_IMAGE: ${{ inputs.payload_image }}
          IMAGE_BUILD_SHA: ${{ github.event.workflow_run.head_sha }}
          CHANNEL_TAG: ${{ steps.channel.outputs.payload_tag }}
        run: |
          if [ -n "$IMAGE_BUILD_SHA" ]; then
            PAYLOAD_IMAGE="ghcr.io/tuna-os/xfce-linux:${IMAGE_BUILD_SHA}"
          fi
          printf '%s\n' "${PAYLOAD_IMAGE:-ghcr.io/tuna-os/xfce-linux:${CHANNEL_TAG}}" > xfce-linux/payload_ref

      - name: Free disk space
        # Must run before Setup Just: tool-cache:true wipes the runner tool
        # cache, which deletes the just binary setup-just just installed.
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true

      - name: Setup Just
        uses: extractions/setup-just@v4

      - name: Expose just to sudo/root
        # Recipes call `just` recursively and run under sudo; root's
        # secure_path won't see the runner tool cache.
        run: sudo ln -sf "$(command -v just)" /usr/local/bin/just

      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y podman buildah rclone jq mtools xorriso skopeo squashfs-tools qemu-system-x86 ovmf socat imagemagick

      - name: Log in to GHCR
        run: echo "${{ env.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u ${{ github.actor }} --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Live ISO
        run: |
          df -h /
          sudo mkdir -p /var/iso-build
          sudo "$(command -v just)" installer_channel=stable output_dir=/var/iso-build iso-sd-boot xfce-linux
          mkdir -p output
          sudo cp /var/iso-build/xfce-linux-live.iso output/
          sudo chown -R "$USER:$(id -gn)" output/

      - name: Compute ISO name
        id: iso
        run: |
          DATE=$(date -u +%Y%m%d)
          SHA=$(git rev-parse --short=7 HEAD)
          echo "dated=xfce-linux-live-${DATE}-${SHA}.iso" >> "$GITHUB_OUTPUT"
          echo "path=output/xfce-linux-live.iso" >> "$GITHUB_OUTPUT"

      - name: Boot verification (UEFI + serial)
        timeout-minutes: 12
        run: |
          ISO="${{ steps.iso.outputs.path }}"
          sudo apt-get install -y qemu-system-x86 ovmf socat imagemagick -qq
          EFI_CODE=""
          for f in /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd /usr/share/edk2/ovmf/OVMF_CODE.fd; do
            [ -f "$f" ] && EFI_CODE="$f" && break
          done
          for f in /usr/share/OVMF/OVMF_VARS_4M.fd /usr/share/OVMF/OVMF_VARS.fd /usr/share/edk2/ovmf/OVMF_VARS.fd; do
            if [ -f "$f" ]; then cp "$f" /tmp/EFI_VARS.fd; break; fi
          done
          [ -n "$EFI_CODE" ] && [ -f /tmp/EFI_VARS.fd ] || \
            { echo "ERROR: UEFI firmware files are missing"; exit 1; }
          PFLASH=(-drive "if=pflash,format=raw,readonly=on,file=$EFI_CODE"
                  -drive "if=pflash,format=raw,file=/tmp/EFI_VARS.fd")
          sudo qemu-system-x86_64 \
            -machine type=q35,accel=kvm -cpu host -m 4G -smp 2 \
            "${PFLASH[@]}" -cdrom "$ISO" -boot d \
            -device virtio-vga \
            -monitor unix:/tmp/qemu-monitor.sock,server,nowait \
            -serial file:/tmp/serial.log -display none -daemonize
          trap 'echo quit | sudo socat - UNIX-CONNECT:/tmp/qemu-monitor.sock >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do [ -S /tmp/qemu-monitor.sock ] && break; sleep 2; done
          for i in $(seq 1 60); do
            sudo grep -q "XFCE_LINUX_LIVE_READY" /tmp/serial.log 2>/dev/null && { echo "==> Ready after $((i*5))s"; break; }
            [ "$i" -eq 60 ] && echo "WARNING: ready token not seen after 5m" || true
            sleep 5
          done
          sudo grep -q "XFCE_LINUX_LIVE_READY" /tmp/serial.log || \
            { echo "ERROR: Live environment did not reach ready state"; sudo tail -50 /tmp/serial.log; exit 1; }
          sudo python3 xfce-linux/src/luks-unlock.py wait-live \
            /tmp/qemu-monitor.sock /tmp/screenshot.ppm
          sudo convert /tmp/screenshot.ppm screenshot.png
      - name: Generate SHA256 checksum
        id: checksum
        run: |
          ISO="${{ steps.iso.outputs.path }}"
          DATED="${{ steps.iso.outputs.dated }}"
          sha256sum "$ISO" | sed "s|${ISO}|${DATED}|" | tee "output/${DATED}-CHECKSUM"
          sha256sum "$ISO" | sed "s|${ISO}|xfce-linux-live-latest.iso|" > "output/xfce-linux-live-latest.iso-CHECKSUM"
          echo "path=output/${DATED}-CHECKSUM" >> "$GITHUB_OUTPUT"
          echo "name=${DATED}-CHECKSUM" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        if: ${{ inputs.skip_upload != true && github.event_name != 'pull_request' }}
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign ISO (cosign keyless)
        id: sign
        if: ${{ inputs.skip_upload != true && github.event_name != 'pull_request' }}
        run: |
          ISO="${{ steps.iso.outputs.path }}"
          cosign sign-blob --yes --bundle "${ISO}.sigstore.json" "$ISO"
          echo "bundle_path=${ISO}.sigstore.json" >> "$GITHUB_OUTPUT"

      - name: Upload ISO to Cloudflare R2
        if: ${{ inputs.skip_upload != true && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stable') }}
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_REGION: auto
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          ISO="${{ steps.iso.outputs.path }}"
          DATED="${{ steps.iso.outputs.dated }}"
          rclone copyto --log-level INFO --checksum --s3-no-check-bucket "$ISO" "R2:${R2_BUCKET}/${{ steps.channel.outputs.r2_prefix }}/${DATED}"
          rclone copyto --log-level INFO --s3-no-check-bucket "$ISO" "R2:${R2_BUCKET}/${{ steps.channel.outputs.r2_prefix }}/xfce-linux-live-latest.iso"
          rclone copyto --log-level INFO --s3-no-check-bucket \
            "${{ steps.checksum.outputs.path }}" "R2:${R2_BUCKET}/${{ steps.channel.outputs.r2_prefix }}/${{ steps.checksum.outputs.name }}"
          rclone copyto --log-level INFO --s3-no-check-bucket \
            output/xfce-linux-live-latest.iso-CHECKSUM "R2:${R2_BUCKET}/${{ steps.channel.outputs.r2_prefix }}/xfce-linux-live-latest.iso-CHECKSUM"
          rclone copyto --log-level INFO --s3-no-check-bucket \
            "${{ steps.sign.outputs.bundle_path }}" "R2:${R2_BUCKET}/${{ steps.channel.outputs.r2_prefix }}/${DATED}.sigstore.json"
          rclone copyto --log-level INFO --s3-no-check-bucket \
            "${{ steps.sign.outputs.bundle_path }}" "R2:${R2_BUCKET}/${{ steps.channel.outputs.r2_prefix }}/xfce-linux-live-latest.iso.sigstore.json"


      - name: Upload ISO as artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.iso.outputs.dated }}
          path: ${{ steps.iso.outputs.path }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload checksum as artifact
        uses: actions/upload-artifact@v7
        with:
          name: checksum-${{ steps.iso.outputs.dated }}
          path: ${{ steps.checksum.outputs.path }}
          if-no-files-found: warn
          retention-days: 7

      - name: Upload boot screenshot as artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: boot-screenshot-xfce-linux
          path: screenshot.png
          if-no-files-found: warn

      - name: Make boot logs readable
        if: always()
        run: sudo chmod a+r /tmp/serial.log 2>/dev/null || true

      - name: Upload boot serial log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-serial-xfce-linux
          path: /tmp/serial.log
          if-no-files-found: warn

      - name: Upload signature bundle
        if: steps.sign.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: signature-${{ steps.iso.outputs.dated }}
          path: ${{ steps.sign.outputs.bundle_path }}
          if-no-files-found: error
