[Config]
MinimumVersion=26

[Distribution]
Distribution=custom
Architecture=x86-64

[Content]
# Checked out by just mkosi-ddi using the normal containerized bst/cache.
BaseTrees=../../.mkosi-root
ExtraTrees=../../files/etc/os-release:/usr/lib/os-release
Bootable=yes
Bootloader=systemd-boot

[Output]
Format=disk
Output=xfce-linux-ddi
OutputDirectory=mkosi.output

RepartDirectories=mkosi.repart
